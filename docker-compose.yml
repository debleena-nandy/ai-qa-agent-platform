# CPU-only stack: Ollama (qwen2.5:3b) + AI QA platform + demo target.
#   docker compose up --build
#   First run downloads about 2.2 GB of models into the "ollama-models" volume.
# Give Docker Desktop at least 8 GB memory (Settings > Resources).

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  ollama:
    image: ollama/ollama:latest
    # No GPU reservation: Ollama runs inference on the CPU.
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1          # one request at a time: best latency on CPU
      - OLLAMA_MAX_LOADED_MODELS=2     # chat model + embedding model
      - OLLAMA_KEEP_ALIVE=30m          # avoid reloading the model between agent calls
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-init:
    # One-off job: downloads the models, then exits. The platform starts only after it succeeds.
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        ollama pull ${OLLAMA_MODEL:-qwen2.5:3b} &&
        ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    restart: "no"

  ai-qa-agent-platform:
    build:
      <<: *app-build
      args:
        INSTALL_BROWSER: "true"        # Playwright Chromium for UI scenarios
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      demo-target:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - WATCHFILES_FORCE_POLLING=true  # makes --reload see edits from a Windows bind mount

      # LLM (mandatory) - CPU tuning for qwen2.5:3b
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-3072}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-300}
      - LLM_MAX_RETRIES=2
      - LLM_MAX_TOOL_STEPS=3
      - LLM_CHECK_ON_STARTUP=true
      - RULE_BASED_FALLBACK=${RULE_BASED_FALLBACK:-false}

      # Smaller scenario batches suit a 3B model on CPU
      - TEST_DESIGN_TARGET_COUNT=${TEST_DESIGN_TARGET_COUNT:-10-12}
      - TEST_DESIGN_MIN_SCENARIOS=${TEST_DESIGN_MIN_SCENARIOS:-8}

      # RAG
      - RAG_ENABLED=true
      - RAG_USE_EMBEDDINGS=${RAG_USE_EMBEDDINGS:-true}

      # Target under test (one origin serves API and UI)
      - QA_API_BASE_URL=http://demo-target:8001
      - QA_ALLOWED_TARGET_HOSTS=demo-target
      - QA_ALLOW_PRIVATE_TARGETS=true  # compose network uses private addresses
      - QA_APPROVAL_TOKEN=${QA_APPROVAL_TOKEN:-change-me}
      - BROWSER_ENABLED=${BROWSER_ENABLED:-true}

      # Persistence and artifacts
      - QA_DATABASE_PATH=/app/data/qa_runs.sqlite3
      - QA_ARTIFACTS_DIR=/app/artifacts
    volumes:
      - .:/app
      - qa-data:/app/data
      - qa-artifacts:/app/artifacts
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  demo-target:
    build: *app-build
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
      - WATCHFILES_FORCE_POLLING=true
      - DEMO_DEFECTS=${DEMO_DEFECTS:-}   # e.g. quantity_limit,price_tamper,server_error
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 12
    command: uvicorn demo_target.main:app --host 0.0.0.0 --port 8001 --reload

volumes:
  ollama-models:
  qa-data:
  qa-artifacts:
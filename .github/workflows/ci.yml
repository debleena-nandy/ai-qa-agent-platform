# File: .github/workflows/ci.yml
# Description: Runs lint, type checks, layered tests, evaluation, and Docker build in CI.
# Author Name: Debleena Nandy
# Date: 07-10-2026
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      LLM_CHECK_ON_STARTUP: "false"
      RULE_BASED_FALLBACK: "true"
      RAG_USE_EMBEDDINGS: "false"
      QA_APPROVAL_TOKEN: "ci-test-token"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Unit tests
        run: mkdir -p reports && pytest tests/unit -q --junitxml=reports/unit.xml
      - name: API and integration tests
        run: pytest tests/integration -q --junitxml=reports/integration.xml
      - name: End-to-end tests
        run: pytest tests/e2e -q --junitxml=reports/e2e.xml
      - name: AI evaluation
        run: python -m evaluation.run_evaluation
      - name: Build container
        run: docker build -t ai-qa-agent-platform .      
      - name: Pylance-equivalent check
        run: pip install pyright && pyright api graph core config agents tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-reports
          path: |
            reports/
            evaluation/reports/latest.json

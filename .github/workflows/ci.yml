# What: GitHub CI mirroring the Jenkins pipeline (lint + tests + JUnit artifact + Docker build).
# Why: Pull requests get feedback without Jenkins; LLM_ENABLED=false keeps CI offline and deterministic.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: mkdir -p reports && pytest -q --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report
          path: reports/junit.xml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-qa-agent-platform .
      - run: docker run --rm -e LLM_ENABLED=false ai-qa-agent-platform pytest -q
